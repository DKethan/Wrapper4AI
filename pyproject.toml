[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wrapper4ai"
version = "1.0.0"
description = "A unified, production-ready Python client for OpenAI, Anthropic, Google Gemini, Mistral AI, DeepSeek, AWS Bedrock, HuggingFace, and Perplexity AI."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Kethan Dosapati"},
]
keywords = [
    "ai", "llm", "openai", "anthropic", "gemini", "claude", "mistral",
    "chatgpt", "deepseek", "bedrock", "huggingface", "perplexity",
    "wrapper", "unified-api", "multi-provider", "chat", "streaming",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "tiktoken>=0.5.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
google = ["google-genai>=1.0.0"]
mistral = ["mistralai>=1.0.0"]
bedrock = ["boto3>=1.28.0"]
huggingface = ["huggingface_hub>=0.20.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=1.0.0",
    "mistralai>=1.0.0",
    "boto3>=1.28.0",
    "huggingface_hub>=0.20.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/DKethan/Wrapper4AI"
Repository = "https://github.com/DKethan/Wrapper4AI"
Issues = "https://github.com/DKethan/Wrapper4AI/issues"
Documentation = "https://github.com/DKethan/Wrapper4AI#readme"
Changelog = "https://github.com/DKethan/Wrapper4AI/releases"

[tool.setuptools.packages.find]
include = ["wrapper4ai*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
